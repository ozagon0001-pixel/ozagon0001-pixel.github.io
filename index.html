<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>喰種RUSH Simulator</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#080808;color:white;font-family:system-ui;text-align:center}.w{max-width:520px;margin:auto;padding:16px}.screen{height:55vh;min-height:360px;border:5px solid #333;border-radius:18px;background:radial-gradient(circle,#5a0010,#080808 60%);display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}.title{font-size:32px;font-weight:900;text-shadow:0 0 15px red}.turn{position:absolute;left:18px;bottom:18px;font-size:46px;font-weight:900}.last{position:absolute;right:18px;bottom:18px;font-weight:900}.result{font-size:24px;line-height:1.7}.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.s{background:#181818;padding:8px;border-radius:9px}.s b{display:block;font-size:20px}button{width:100%;height:58px;margin:5px 0;border:0;border-radius:12px;font-size:17px;font-weight:900;background:#c51622;color:#fff;touch-action:manipulation}button:last-child{background:#eee;color:#111}.hit{animation:f .5s}@keyframes f{50%{filter:brightness(3);transform:scale(1.02)}}small{color:#888}
</style></head><body><div class="w">
<h2>🩸 喰種RUSH シミュレーター</h2>
<div id="screen" class="screen"><div id="title" class="title">RUSH START</div><div id="msg">STARTを押してください</div><div id="turn" class="turn"></div><div id="last" class="last"></div></div>
<div class="stats"><div class="s">TOTAL<b id="balls">0</b></div><div class="s">BONUS<b id="hits">0</b></div></div>
<button id="start">HYPER 喰種RUSH START</button><button id="spin">▶ PUSH / 1回転</button><button id="reset">リセット</button>
<small>ブラウザ動作確認用公開版</small></div>
<script>
let active=false,busy=false,turns=5,balls=0,hits=0,last=0,P=1/7.7;
const $=x=>document.getElementById(x);
function draw(){$("balls").textContent=balls.toLocaleString();$("hits").textContent=hits;$("turn").textContent=active?turns:"";$("last").textContent=active&&last?last.toLocaleString()+"玉":"";$("start").style.opacity=active?".4":"1";$("spin").style.opacity=active&&!busy?"1":".4"}
function start(){if(active)return;active=true;busy=false;turns=5;balls=0;hits=0;last=0;$("title").textContent="HYPER RUSH";$("msg").textContent="PUSHで1回転";draw()}
function spin(){if(!active||busy)return;busy=true;draw();setTimeout(()=>{turns--;if(Math.random()<P)hit();else miss()},250)}
function hit(){let r=Math.random(),a=r<.5?3000:r<.75?6000:r<.875?9000:12000+3000*Math.floor(Math.random()*4);balls+=a;last=a;hits++;turns=5;$("screen").classList.remove("hit");void $("screen").offsetWidth;$("screen").classList.add("hit");$("title").textContent="大当り!!";$("msg").textContent=a.toLocaleString()+"玉";draw();setTimeout(()=>{busy=false;$("title").textContent="HYPER RUSH";$("msg").textContent="PUSHで次の回転";draw()},800)}
function miss(){if(turns<=0){active=false;busy=false;$("title").textContent="RESULT";$("msg").innerHTML='<div class="result">BONUS '+hits+'回<br>TOTAL '+balls.toLocaleString()+'玉</div>';draw()}else{busy=false;$("title").textContent="HYPER RUSH";$("msg").textContent="ハズレ / 残り"+turns+"回転";draw()}}
function reset(){active=false;busy=false;turns=5;balls=0;hits=0;last=0;$("title").textContent="RUSH START";$("msg").textContent="STARTを押してください";draw()}
$("start").addEventListener("click",start);$("spin").addEventListener("click",spin);$("reset").addEventListener("click",reset);draw();
</script></body></html>
