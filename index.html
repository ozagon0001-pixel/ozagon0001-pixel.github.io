<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>喰種RUSH シミュレーター</title><style>
*{box-sizing:border-box}html,body{margin:0;background:#050505;color:#fff;font-family:system-ui,-apple-system,sans-serif;text-align:center}body{min-height:100vh}.wrap{width:min(96vw,680px);margin:auto;padding:10px 8px 28px}h1{font-size:20px;margin:5px}.machine{position:relative;width:min(94vw,390px);margin:auto}.cab{display:block;width:100%;height:auto}.screen{position:absolute;left:12.5%;top:35.3%;width:75%;height:29%;overflow:hidden;border-radius:7px;background:#000}.screen img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}.screen img.show{display:block}.turn,.last{position:absolute;z-index:5;bottom:8%;background:#000c;border-radius:6px;font-weight:900;text-shadow:1px 1px #000}.turn{left:4%;font-size:30px;border:2px solid #e5b52d;padding:1px 7px}.turn small{font-size:8px}.last{right:4%;border:2px solid #8d6cff;padding:4px 6px;font-size:18px}.last small{display:block;font-size:7px;color:#ddd}.result{position:absolute;z-index:6;left:5%;right:5%;bottom:11%;display:none;justify-content:center;gap:6px}.result div{background:#160912e8;border:2px solid #87385f;border-radius:8px;padding:7px 10px;min-width:100px}.result small{display:block;font-size:8px}.result b{font-size:20px}.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:5px;margin:8px 0}.stat{background:#181818;border:1px solid #333;border-radius:8px;padding:6px;font-size:10px;color:#aaa}.stat b{display:block;color:#fff;font-size:17px}.status{font-weight:900;margin:6px;min-height:20px}.controls{background:#151515;border:1px solid #333;border-radius:11px;padding:9px}button{display:block;width:100%;height:54px;margin:6px 0;border:0;border-radius:11px;font-size:16px;font-weight:900;background:#c7151f;color:#fff;cursor:pointer;touch-action:manipulation}button:last-child{background:#eee;color:#111}button:active{transform:scale(.98)}#log{height:68px;overflow:auto;text-align:left;background:#090909;border:1px solid #222;border-radius:8px;padding:7px;font-size:11px;color:#ccc}.flash{animation:f .45s}@keyframes f{50%{filter:brightness(3)}}@media(min-width:601px){.stats{grid-template-columns:repeat(4,1fr)}button{display:inline-block;width:auto;min-width:190px;margin:4px}}
</style></head><body><div class="wrap"><h1>🩸 喰種RUSH シミュレーター</h1>
<div class="machine"><img class="cab" src="download.webp" alt=""><div id="screen" class="screen">
<img id="startImg" class="show" src="%E9%96%8B%E5%A7%8B.webp" alt=""><img id="rushImg" src="7db89cc1-a76a-4956-bee2-1815701a6f2c.png" alt=""><img id="hitImg" src="e_tokyoghoul-gazou113.webp" alt=""><img id="resultImg" src="031181fe-0f14-4dc2-a8f6-7fa3dda66de6.png" alt="">
<div id="turn" class="turn"></div><div id="last" class="last"></div><div id="result" class="result"><div><small>BONUS</small><b id="rb">0</b>回</div><div><small>TOTAL</small><b id="rt">0</b>玉</div></div></div></div>
<div id="status" class="status">RUSHを開始してください</div><div class="stats"><div class="stat">今回の出玉<b id="balls">0</b></div><div class="stat">継続<b id="cont">0</b></div><div class="stat">大当り<b id="hits">0</b></div><div class="stat">最高出玉<b id="max">0</b></div></div>
<div class="controls"><button id="start">HYPER 喰種RUSH START</button><button id="spin">▶ PUSH / 1回転</button><button id="reset">リセット</button></div><div id="log">演出ログ：STARTを押してください。</div></div>
<script>
var active=false,busy=false,turns=5,balls=0,hits=0,cont=0,max=0,last=0,P=1/7.7;function $(x){return document.getElementById(x)}function image(id){["startImg","rushImg","hitImg","resultImg"].forEach(x=>$(x).className="");$(id).className="show"}function log(t){$("log").innerHTML=t+"<br>"+$("log").innerHTML}function draw(){$("balls").textContent=balls.toLocaleString();$("hits").textContent=hits;$("cont").textContent=cont;$("max").textContent=max.toLocaleString();$("turn").innerHTML=active?turns+"<small>回転</small>":"";$("turn").style.display=active?"block":"none";$("last").innerHTML=active&&last?"<small>LAST BONUS</small>"+last.toLocaleString()+"玉":"";$("last").style.display=active?"block":"none";$("start").style.opacity=active||busy?".4":"1";$("spin").style.opacity=!active||busy?".4":"1";$("status").textContent=active?"HYPER 喰種RUSH":"RUSHを開始してください"}
function start(){if(active||busy)return;active=true;turns=5;balls=hits=cont=last=0;$("result").style.display="none";image("rushImg");log("🔥 HYPER喰種RUSH突入！");draw()}function spin(){if(!active||busy)return;busy=true;draw();setTimeout(function(){turns--;Math.random()<P?hit():miss()},280)}
function hit(){var r=Math.random(),a=r<.5?3000:r<.75?6000:r<.875?9000:12000+3000*Math.floor(Math.random()*4);balls+=a;last=a;hits++;cont++;turns=5;max=Math.max(max,balls);image("hitImg");$("screen").classList.remove("flash");void $("screen").offsetWidth;$("screen").classList.add("flash");log("🔥 大当り "+a.toLocaleString()+"玉 / 累計 "+balls.toLocaleString()+"玉");draw();setTimeout(function(){image("rushImg");busy=false;draw()},1100)}
function miss(){log("❌ ハズレ / 残り"+turns+"回転");if(turns<=0){active=false;busy=false;image("resultImg");$("rb").textContent=hits;$("rt").textContent=balls.toLocaleString();$("result").style.display="flex";draw();$("status").textContent="RUSH終了"}else{busy=false;image("rushImg");draw()}}
function reset(){active=busy=false;turns=5;balls=hits=cont=max=last=0;$("result").style.display="none";image("startImg");draw()}$("start").onclick=start;$("spin").onclick=spin;$("reset").onclick=reset;draw();
</script></body></html>
